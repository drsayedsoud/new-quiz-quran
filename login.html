<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل الدخول | مسابقة القرآن</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background-color: #1e1e1e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .welcome-message {
      font-size: 24px;
      color: #00bcd4;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .welcome-message span {
      display: block;
      font-size: 18px;
      margin-top: 5px;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 20px;
      color: #00e676;
    }

    h2 {
      margin-bottom: 30px;
      font-size: 28px;
      color: #00bcd4;
    }

    input[type="email"],
    input[type="password"] {
      display: none; /* ✅ إخفاء حقول الإدخال */
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #00bcd4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #00acc1;
    }

    .link {
      margin-top: 20px;
      display: none; /* ✅ إخفاء رابط التسجيل */
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      h1 { font-size: 1.5rem; }
      button { font-size: 14px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="welcome-message">
      <div class="icon">🎉</div>
      <span>أهلاً ومرحباً بكم في</span>
      <span>مسابقات القرآن والسنة</span>
    </div>

    <h2>دخول مباشر</h2>

    <!-- ✅ زر الدخول المباشر -->
    <button onclick="goToIndex()">🎯 دخول إلى المسابقة</button>
  </div>

  <script>
    function goToIndex() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
