<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحديث ملف الأسئلة وتحويله إلى JSON</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f8ff;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #333;
    }
    .container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      width: 100%;
      border: 1px solid #b0e0e6;
      box-sizing: border-box;
    }
    h1 {
      color: #007bff;
      margin-bottom: 20px;
      font-size: 2.5em;
      direction: rtl;
    }
    p {
      font-size: 1.1em;
      color: #5f9ea0;
      margin-bottom: 30px;
      direction: rtl;
      line-height: 1.6;
    }
    button {
      background-color: #007bff;
      color: white;
      padding: 15px 35px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.3em;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    button:hover {
      background-color: #0056b3;
      transform: translateY(-3px);
    }
    #statusMessage {
      margin-top: 30px;
      font-weight: bold;
      font-size: 1.1em;
      padding: 15px 20px;
      border-radius: 10px;
      transition: all 0.4s ease;
    }
    .success {
      background-color: #e6ffe6;
      color: #28a745;
      border: 1px solid #8bc34a;
    }
    .error {
      background-color: #ffe0e0;
      color: #dc3545;
      border: 1px solid #ef5350;
    }
    .info {
      background-color: #e0f7fa;
      color: #00838f;
      border: 1px solid #4dd0e1;
    }
    .loading {
      background-color: #fffacd;
      color: #ffc107;
      border: 1px solid #ffeb3b;
    }
    .note {
      margin-top: 30px;
      font-size: 0.95em;
      color: #607d8b;
      border-top: 1px solid #eee;
      padding-top: 25px;
      line-height: 1.5;
    }

    /* زر العودة */
    #home-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 999;
      transition: background-color 0.3s ease;
    }

    #home-btn:hover {
      background-color: #218838;
    }

    @media (max-width: 768px) {
      #home-btn {
        bottom: 15px;
        right: 15px;
        font-size: 14px;
        padding: 12px 20px;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="container">
  <h1>اضغط لتحميل ملف الأسئلة وتحويله إلى JSON</h1>

  <p>
    اضغط على الزر أدناه لتحميل ملف <strong>quran.xlsx</strong> وتحويله إلى <strong>quran.json</strong>.
    سيتم تحويل الملف وتصديره فورًا للتنزيل.
  </p>

  <button id="downloadButton">تنزيل ملف الأسئلة الآن</button>

  <div id="statusMessage" class="info">
    للبدء، اضغط على "تنزيل ملف الأسئلة الآن".
  </div>

  <p class="note">
    سيتم تحويل ملف Excel إلى JSON دون فقد أي بيانات أو أسماء أعمدة أو صفحات.
  </p>
</div>

<!-- زر العودة -->
<button id="home-btn" onclick="goHome()">🏠 العودة إلى الصفحة الرئيسية</button>

<script>
  function goHome() {
    window.location.href = "index.html";
  }

  document.addEventListener('DOMContentLoaded', () => {
    const downloadButton = document.getElementById('downloadButton');
    const statusMessage = document.getElementById('statusMessage');

    // دالة لتحميل ملف Excel وتحويله إلى JSON
    async function convertExcelToJSON(file) {
      const reader = new FileReader();
      reader.onload = async function(event) {
        const data = event.target.result;
        const workbook = XLSX.read(data, { type: 'binary' });

        const result = {};
        workbook.SheetNames.forEach((sheetName) => {
          const sheet = workbook.Sheets[sheetName];
          result[sheetName] = XLSX.utils.sheet_to_json(sheet);
        });

        const json = JSON.stringify(result, null, 2);
        const blob = new Blob([json], { type: 'application/json' });

        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'quran.json';
        link.click();
      };
      reader.readAsBinaryString(file);
    }

    // عندما يتم الضغط على زر التحميل
    downloadButton.addEventListener('click', async () => {
      statusMessage.textContent = 'جاري تحويل الملف، الرجاء الانتظار...';
      statusMessage.className = 'loading';
      downloadButton.disabled = true;

      try {
        const response = await fetch('quran.xlsx'); // تحميل ملف Excel من الخادم
        const fileBlob = await response.blob();
        convertExcelToJSON(fileBlob);
        statusMessage.textContent = '✅ تم تحميل وتحويل الملف بنجاح.';
        statusMessage.className = 'success';
      } catch (error) {
        statusMessage.textContent = `❌ فشل في تحميل أو تحويل الملف: ${error.message}`;
        statusMessage.className = 'error';
        downloadButton.disabled = false;
      }
    });
  });
</script>

</body>
</html>
