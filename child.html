  <style>
    @font-face {
      font-family: 'Cairo';
      src: url('Cairo-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Cairo';
      src: url('Cairo-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      background-color: #b8e994;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.3) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,0.3) 0%, transparent 20%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;

      animation: cloudMove 60s linear infinite;
    }

    .option.correct {
  background-color: #2ecc71 !important; /* أخضر */
  color: white !important;
}

.option.wrong {
  background-color: #e74c3c !important; /* أحمر */
  color: white !important;
}

}


    @keyframes cloudMove {

      100% { background-position: 100% 0%; }
    }

    .container {
      width: 100%;
      max-width: 500px;

      border-radius: 30px;
      box-shadow: 0 0 30px rgba(0,0,0,0.2);
      padding: 20px;

      position: relative;
      overflow: hidden;
    }



    @keyframes rotateBorder {

      100% { transform: rotate(360deg); }
    }

    #quiz-header {
      text-align: center;
      margin-bottom: 20px;
    }

    #quiz-title {
      font-size: 28px;
      margin-bottom: 10px;
      color: #e55039;
      text-shadow: 2px 2px 0 #f6b93b;
      font-weight: bold;
    }

    .timer-box {
      font-size: 16px;
      color: #555;
      margin-top: 10px;
      background-color: rgba(253, 203, 110, 0.5);
      padding: 8px;
      border-radius: 15px;
      display: inline-block;
    }

    .score-box {
      font-size: 16px;
      color: #2ecc71;
      margin-top: 8px;
      background-color: rgba(46, 204, 113, 0.2);
      padding: 8px;
      border-radius: 15px;
      display: inline-block;
    }

    #question-area {
      margin-top: 20px;
    }

    #question-text {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #0984e3;
      line-height: 1.6;
      margin: 20px 0;
      background-color: rgba(255, 242, 153, 0.7);
      padding: 15px;
      border-radius: 20px;
      border: 3px dotted #f39c12;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .option {
      background-color: #74b9ff;
      border: none;
      color: white;
      padding: 16px;
      font-size: 20px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      box-shadow: 0 5px 0 #0984e3;
      position: relative;
    }

    .option:hover {
      background-color: #0984e3;
      transform: translateY(-3px);
    }

    .option:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0984e3;
    }

    .footer {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer button {
      padding: 12px 20px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      cursor: pointer;
      color: white;
      transition: all 0.3s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    #explanation-btn {
      background-color: #f39c12;
      box-shadow: 0 4px 0 #e67e22;
    }
    #end-quiz-btn-footer {
      background-color: #e74c3c;
      box-shadow: 0 4px 0 #c0392b;
    }
    #logout-btn {
      background-color: #9b59b6;
      box-shadow: 0 4px 0 #8e44ad;
    }
    .balloon {
  position: absolute;
  bottom: -100px;
  width: 40px;
  height: 60px;
  background-color: red;
  border-radius: 50% 50% 40% 40%;
  animation: floatUp 4s ease-out forwards;
  z-index: 9999;
}

@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
}

    .footer button:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 rgba(0,0,0,0.2);
    }

    .footer button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      color: #e55039;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
      font-weight: bold;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress-bar-container-3d {
      width: 100%;
      height: 20px;
      background-color: #fdcb6e;
      border-radius: 15px;
      overflow: hidden;
      margin-top: 15px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
      position: relative;
    }

    .progress-bar-fill-3d {
      height: 100%;
      width: 100%;
      background: linear-gradient(to right, #55efc4, #00b894);
      border-radius: 15px;
      transition: width 0.9s linear, background-color 0.9s linear;
      box-shadow: 0 0 10px #55efc4;
    }

    .progress-bar-fill-3d.blinking {
      animation: blink-red 0.5s infinite alternate;
    }

    @keyframes blink-red {
      from { background-color: #ff7675; }
      to { background-color: #e84393; }
    }

    .emoji {
      font-size: 24px;
      margin-left: 5px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      #quiz-title {
        font-size: 24px;
      }

      #question-text {

      }

      .option {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="loading-overlay" class="hidden">
    <div style="text-align: center;">

    </div>
  </div>
   <!-- مؤثرات البالونات -->
<div id="balloon-festival" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></div>

<!-- مؤثرات الصوت -->
<audio id="wow-sound" src="assets/wow.mp3" preload="auto"></audio>

  <div class="container">
    <div id="quiz-header">
      <h2 id="quiz-title">مسابقة الأطفال الممتعة! 🎉</h2>
      <div id="quiz-info" style="font-size: 16px; color: #666; margin-top: 10px;"></div>

      <div class="timer-box">

        <canvas id="hero-canvas" width="600" height="160" style="width: 100%; background: none; border-radius: 15px; margin: 10px 0;"></canvas>

      <div class="options">

        <button class="option">🍊 الخيار الثاني</button>

    <div class="footer">
      <button id="explanation-btn" onclick="showExplanation()">📚 الشرح</button>
      <button id="end-quiz-btn-footer" onclick="endQuiz()">🛑 إنهاء اللعبة</button>

  <script>
    document.getElementById("quiz-title").textContent =
      localStorage.getItem("quizTitle") || "مسابقة الأطفال الممتعة! 🎉";
    document.getElementById("loading-overlay").classList.add("hidden");

    function logout() {
      localStorage.removeItem("userEmail");
      window.location.href = "login.html";
    }

    // Simple sound functions using built-in Web Audio API
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.frequency.value = 800;
          gain.gain.value = 0.1;
          osc.type = 'sine';
        } else if (type === 'correct') {
          osc.frequency.value = 1046.5; // C6
          gain.gain.value = 0.1;
          osc.type = 'triangle';
        } else if (type === 'wrong') {
          osc.frequency.value = 220;
          gain.gain.value = 0.1;
          osc.type = 'sawtooth';
        }

        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.stop(ctx.currentTime + 0.5);
      } catch(e) {
        console.log("Audio not supported");
      }
    }
function showBalloonFestival() {
  const container = document.getElementById("balloon-festival");
  container.innerHTML = "";

  for (let i = 0; i < 20; i++) {
    const balloon = document.createElement("div");
    balloon.className = "balloon";
    balloon.style.left = Math.random() * 100 + "vw";
    balloon.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
    balloon.style.animationDelay = `${Math.random()}s`;
    container.appendChild(balloon);
  }

  // ✅ تشغيل الصوت فقط إذا لم يكن مكتومًا
  const soundOn = localStorage.getItem("soundOn");
  if (soundOn === null || soundOn === "true") {
    const wowSound = document.getElementById("wow-sound");
    wowSound.currentTime = 0;
    wowSound.play().catch(() => {});
  }

  setTimeout(() => container.innerHTML = "", 4000);
}

    // Add emojis to options when page loads
    window.onload = function() {
      const options = document.querySelectorAll('.option');
      const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];

      options.forEach((option, index) => {
        // Add random emoji to each option
        const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
        option.textContent = option.textContent + ' ' + randomEmoji;

        // Add click effect
        option.addEventListener('click', function() {
          showBalloonFestival();

          this.style.transform = 'scale(0.95)';
          playSound('click');
          setTimeout(() => {
            this.style.transform = 'scale(1)';
          }, 200);
        });
      });
    };
  </script>
<script>
  const canvas = document.getElementById("hero-canvas");
  const ctx = canvas.getContext("2d");

  const total = 20; // عدد الإجابات لكل مرحلة
  const size = 140; // حجم البطل

  const heroes = [
    { src: "assets/superman.png", loaded: false, img: new Image() },
    { src: "assets/patman.png", loaded: false, img: new Image() },
    { src: "assets/spiderman.png", loaded: false, img: new Image() },
    { src: "assets/hulkman.png", loaded: false, img: new Image() },
    { src: "assets/mahmoud.png", loaded: false, img: new Image() }
  ];

  heroes.forEach(hero => {
    hero.img.src = hero.src;
    hero.img.onload = () => { hero.loaded = true };
  });

  function drawHeroes(correct) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const phase = Math.floor(correct / total);
    const step = correct % total;

    for (let i = 0; i <= phase; i++) {
      const hero = heroes[i];
      if (!hero || !hero.loaded) continue;

      const progress = (i < phase) ? 1 : step / total;
      const x = progress * (canvas.width - size);

      // ظل بسيط
      ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      ctx.drawImage(hero.img, x, 10, size, size);

      ctx.shadowColor = "transparent"; // إلغاء الظل بعد كل صورة
    }
  }

  // راقب عداد الإجابات الصحيحة
  const counterEl = document.getElementById("correct-counter");
  const observer = new MutationObserver(() => {
    const correct = parseInt(counterEl.textContent || "0");
    drawHeroes(correct);
  });

  observer.observe(counterEl, { childList: true, subtree: true });

  drawHeroes(0);
</script>


  <script src="script.js"></script>
