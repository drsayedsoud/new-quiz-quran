<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الانتظار - Quran Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        .lobby-container { text-align: center; margin-top: 50px; }
        .room-code-box { font-size: 3em; font-weight: bold; color: var(--heading-color); letter-spacing: 5px; margin: 20px 0; padding: 20px; background: var(--card-bg-gradient-start); border-radius: 15px; border: 2px dashed var(--button-green); display: inline-block; }
        .players-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .player-card { background: var(--card-bg-gradient-end); padding: 15px; border-radius: 10px; border: 1px solid var(--card-border); text-align: center; width: 120px; }
        .player-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--button-green); }
        .player-card p { margin: 10px 0 0 0; font-weight: bold; }
        #join-form { display: none; margin-top: 20px; }
        .avatar-selection { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .avatar-option { width: 60px; height: 60px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .avatar-option.selected { border-color: var(--button-green); }
        @media (max-width: 768px) {
            .lobby-container { margin-top: 20px; padding: 10px; }
            .room-code-box { font-size: 2em; padding: 15px; }
            .player-card { width: 40%; padding: 10px; }
            .player-card img { width: 60px; height: 60px; }
            .avatar-option { width: 50px; height: 50px; }
            #player-name { width: 90%; }
        }
    </style>
</head>
<body>
    <div class="lobby-container">
        <h1 id="lobby-title">جاري التحميل...</h1>
        <div id="host-view" style="display: none;">
            <p>شارك هذا الكود مع أصدقائك لدخول الغرفة:</p>
            <div class="room-code-box" id="display-room-code">-----</div>
            <br>
            <button id="whatsapp-invite-btn" style="background: #25D366; color: white; padding: 10px 20px; font-size: 1.1em; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12.031 0C5.46 0 0 5.45 0 12.016c0 2.115.553 4.182 1.6 6.002L.15 24l6.146-1.57A11.96 11.96 0 0012.031 24c6.571 0 12.031-5.45 12.031-12.016C24.062 5.45 18.602 0 12.031 0zM12.031 22.02c-1.848 0-3.655-.497-5.241-1.439l-.376-.223-3.89 1.012 1.036-3.818-.245-.39A10.027 10.027 0 011.982 12.016c0-5.523 4.498-10.035 10.05-10.035 5.54 0 10.048 4.512 10.048 10.035 0 5.525-4.509 10.004-10.049 10.004zM17.55 14.5c-.303-.153-1.792-.888-2.07-.988-.278-.101-.481-.153-.685.153-.203.305-.783.988-.959 1.19-.177.203-.354.229-.657.076-2.18-.956-3.782-2.314-4.839-4.32-.102-.202-.01-.311.141-.463.136-.137.304-.356.455-.534.153-.178.204-.305.304-.508.102-.203.05-.382-.025-.534-.076-.152-.685-1.65-.938-2.261-.247-.594-.497-.514-.685-.523-.177-.01-.381-.01-.584-.01-.203 0-.533.076-.811.381-.279.305-1.065 1.042-1.065 2.54 0 1.5 1.09 2.95 1.242 3.153.152.203 2.148 3.282 5.2 4.598 1.488.643 2.378 1.05 3.197 1.344 1.486.47 2.839.403 3.905.245 1.192-.176 3.662-1.498 4.168-2.946.508-1.447.508-2.69.356-2.945-.152-.254-.558-.407-.862-.559z"/></svg>
                دعوة الأصدقاء عبر واتساب
            </button>
            <br>
            <button id="start-game-btn" class="three-d-button" style="background: var(--button-green); color: white; display: none;">🚀 ابدأ المسابقة الآن</button>
        </div>

        <div id="join-form">
            <h2>انضمام للغرفة</h2>
            <p>اختر صورتك الرمزية:</p>
            <div class="avatar-selection">
                <img src="assets/hulkman.png" class="avatar-option selected" data-avatar="assets/hulkman.png">
                <img src="assets/superman.png" class="avatar-option" data-avatar="assets/superman.png">
                <img src="assets/patman.png" class="avatar-option" data-avatar="assets/patman.png">
                <img src="assets/child.jpeg" class="avatar-option" data-avatar="assets/child.jpeg">
            </div>
            <input type="text" id="player-name" placeholder="اكتب اسمك هنا..." style="padding: 10px; width: 250px; text-align: center; border-radius: 5px; font-size: 1.1em;"><br><br>
            <button id="join-btn" style="background: var(--button-blue); color: white; padding: 10px 30px; font-size: 1.2em; border: none; border-radius: 5px; cursor: pointer;">دخول الغرفة</button>
        </div>

        <h3 style="margin-top: 40px; color: var(--text-color);">اللاعبون المتصلون: <span id="players-count">0</span></h3>
        <div class="players-grid" id="players-list"></div>
    </div>
    <script type="module" src="lobby.js"></script>
</body>
</html>
